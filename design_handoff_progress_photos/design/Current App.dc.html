<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <style>body{margin:0;background:#2a2a2c;color:#fff} a{color:#1d3b2a} a:hover{color:#1d3b2a}</style>
</helmet>
<div style="padding:40px;font-family:system-ui,-apple-system,sans-serif;color:#fff">
  <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:16px">Current app — recreated from src/app (style.css, main.ts, upload.ts, manage.ts)</div>
  <div style="display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;opacity:.6">Upload tab</div>
      <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="{{ 393 }}" height="{{ 852 }}" dark="{{ true }}" hint-size="393px,852px">
        <div style="padding:54px 16px 24px;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;font-size:16px;min-height:100%;box-sizing:border-box">
          <div style="display:flex;flex-direction:column;gap:12px;padding:16px 0">
            <label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:#6b7280">Project
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:10px;border:1px solid #c9ccd1;border-radius:8px;background:#000;color:#fff">Birken Lofts<span style="font-size:11px">▼</span></div>
            </label>
            <div style="display:flex;gap:8px">
              <div style="flex:1;text-align:center;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #1d3b2a;background:#1d3b2a;color:#fff">Upload</div>
              <div style="flex:1;text-align:center;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Manage</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="width:100%;text-align:center;font-size:16px;padding:14px;border-radius:8px;border:1px dashed #c9ccd1;background:#000;color:#fff;box-sizing:border-box">Add photos</div>
            <label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:#6b7280">Caption for this batch
              <div style="font-size:16px;padding:10px;border:1px solid #c9ccd1;border-radius:8px;background:#000;color:#fff">4th floor post demolition</div>
            </label>
            <div style="display:flex;flex-direction:column;gap:12px">
              <sc-for list="{{ queue }}" as="p" hint-placeholder-count="3">
                <div style="display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start">
                  <img src="{{ p.src }}" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:6px;background:#e5e7eb">
                  <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
                    <div style="font-size:16px;padding:10px;border:1px solid #c9ccd1;border-radius:8px;background:#000;color:#8a8a8e;white-space:nowrap;overflow:hidden">Caption (overrides batch)</div>
                    <span style="font-size:14px">Ready</span>
                    <div><span style="display:inline-block;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Remove</span></div>
                  </div>
                </div>
              </sc-for>
            </div>
            <div style="width:100%;text-align:center;font-size:16px;padding:14px;border-radius:8px;border:1px solid #1d3b2a;background:#1d3b2a;color:#fff;box-sizing:border-box">Upload</div>
          </div>
        </div>
      </x-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:13px;opacity:.6">Manage tab</div>
      <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="{{ 393 }}" height="{{ 852 }}" dark="{{ true }}" hint-size="393px,852px">
        <div style="padding:54px 16px 24px;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;font-size:16px;min-height:100%;box-sizing:border-box">
          <div style="display:flex;flex-direction:column;gap:12px;padding:16px 0">
            <label style="display:flex;flex-direction:column;gap:4px;font-size:14px;color:#6b7280">Project
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:10px;border:1px solid #c9ccd1;border-radius:8px;background:#000;color:#fff">Birken Lofts<span style="font-size:11px">▼</span></div>
            </label>
            <div style="display:flex;gap:8px">
              <div style="flex:1;text-align:center;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Upload</div>
              <div style="flex:1;text-align:center;font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #1d3b2a;background:#1d3b2a;color:#fff">Manage</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{ photos }}" as="p" hint-placeholder-count="3">
              <div style="display:grid;grid-template-columns:80px 1fr;gap:10px">
                <img src="{{ p.src }}" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:6px;background:#e5e7eb">
                <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
                  <span style="color:#6b7280;font-size:14px">{{ p.time }}</span>
                  <div style="font-size:16px;padding:10px;border:1px solid #c9ccd1;border-radius:8px;background:#000;color:#fff;white-space:nowrap;overflow:hidden">4th floor post demolition</div>
                  <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <span style="font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Save</span>
                    <span style="font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Hide</span>
                    <span style="font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid #c9ccd1;background:#000;color:#fff">Delete</span>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      queue: [{ src: "photos/q1.png" }, { src: "photos/q2.png" }, { src: "photos/q3.png" }],
      photos: [
        { src: "photos/p1.png", time: "10/5/2026, 8:52:07 AM" },
        { src: "photos/p2.png", time: "10/5/2026, 8:51:57 AM" },
        { src: "photos/p3.png", time: "10/5/2026, 8:51:45 AM" },
        { src: "photos/q1.png", time: "10/5/2026, 8:51:30 AM" },
      ],
    };
  }
}
</script>
</body>
</html>
