name: Deploy production
# Runs after every staging deploy on main (called from ci.yml), and by hand for a redeploy.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Waits for the production environment's required reviewer (GitHub notifies them).
  # A newer run cancels one still waiting here, so an approval always ships the latest main.
  approve:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-approval
      cancel-in-progress: true
    steps:
      - run: echo "Approved ${{ github.sha }} for production"

  # Never cancelled mid-run: a newer approved deploy queues behind it.
  deploy:
    needs: approve
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build && node scripts/check-embed-size.ts
      - run: npx wrangler d1 migrations apply progress-photos --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
